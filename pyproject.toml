[project]
name = "rag-agent"
version = "0.1.0"
description = "Local, privacy-first RAG agent that answers questions over Nike's 2023 10-K using Ollama, LangChain, and Streamlit"
requires-python = ">=3.13"
dependencies = [
    "bs4>=0.0.2",
    "langchain>=1.2.10",
    "langchain-community",
    "langchain-ollama",
    "langchain-text-splitters>=1.1.1",
    "pypdf",
    "streamlit>=1.55.0",
]
