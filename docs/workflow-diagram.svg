<svg viewBox="0 0 1080 560" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1080" height="560" fill="#ffffff"/>

  <!-- rag-app container -->
  <rect x="20" y="20" width="920" height="360" rx="14" fill="none" stroke="#a855f7" stroke-width="2" stroke-dasharray="8,5"/>
  <text x="36" y="46" fill="#7e22ce" font-size="13" font-weight="700">rag-app container &#183; Streamlit :8501</text>

  <!-- Row 1: ingestion (cached once) -->
  <text x="36" y="72" fill="#9ca3af" font-size="11" font-weight="600">INGESTION (cached on startup)</text>

  <rect x="50" y="80" width="140" height="50" rx="25" fill="#111827"/>
  <text x="120" y="110" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="600">Nike 10-K PDF</text>

  <line x1="190" y1="105" x2="222" y2="105" stroke="#4b5563" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="224" y="75" width="190" height="60" rx="10" fill="#3b82f6"/>
  <text x="319" y="100" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="700">LOAD &amp; SPLIT</text>
  <text x="319" y="118" text-anchor="middle" fill="#eaf1ff" font-size="11">PyPDFLoader + RecursiveCharacterTextSplitter</text>

  <line x1="414" y1="105" x2="446" y2="105" stroke="#4b5563" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="448" y="75" width="180" height="60" rx="10" fill="#f59e0b"/>
  <text x="538" y="100" text-anchor="middle" fill="#111827" font-size="14" font-weight="700">EMBED</text>
  <text x="538" y="118" text-anchor="middle" fill="#111827" font-size="11">nomic-embed-text</text>

  <line x1="628" y1="105" x2="660" y2="105" stroke="#4b5563" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="662" y="75" width="200" height="60" rx="10" fill="#0891b2"/>
  <text x="762" y="100" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="700">VECTOR STORE</text>
  <text x="762" y="118" text-anchor="middle" fill="#e6fbff" font-size="11">InMemoryVectorStore</text>

  <!-- Row 2: per-query flow -->
  <text x="36" y="208" fill="#9ca3af" font-size="11" font-weight="600">PER QUERY (Streamlit chat)</text>

  <rect x="50" y="216" width="160" height="50" rx="25" fill="#111827"/>
  <text x="130" y="246" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="600">User Question</text>

  <line x1="210" y1="241" x2="242" y2="241" stroke="#4b5563" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="244" y="211" width="180" height="60" rx="10" fill="#3b82f6"/>
  <text x="334" y="236" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="700">RETRIEVE</text>
  <text x="334" y="254" text-anchor="middle" fill="#eaf1ff" font-size="11">top-k similarity search</text>

  <line x1="424" y1="241" x2="456" y2="241" stroke="#4b5563" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="458" y="211" width="180" height="60" rx="10" fill="#6b7280"/>
  <text x="548" y="236" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="700">BUILD CONTEXT</text>
  <text x="548" y="254" text-anchor="middle" fill="#f3f4f6" font-size="11">system + human message</text>

  <line x1="638" y1="241" x2="670" y2="241" stroke="#4b5563" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="672" y="211" width="190" height="60" rx="10" fill="#22c55e"/>
  <text x="767" y="236" text-anchor="middle" fill="#0f2c19" font-size="14" font-weight="700">GENERATE</text>
  <text x="767" y="254" text-anchor="middle" fill="#0f2c19" font-size="11">Llama 3.1 (ChatOllama, streamed)</text>

  <!-- Vector store feeds retrieve -->
  <path d="M762,135 L390,211" stroke="#4b5563" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <!-- Generate -> Answer -->
  <line x1="767" y1="271" x2="767" y2="300" stroke="#4b5563" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="622" y="302" width="290" height="56" rx="10" fill="#111827"/>
  <text x="767" y="325" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">Answer streamed to chat</text>
  <text x="767" y="343" text-anchor="middle" fill="#d1d5db" font-size="11">+ "View Sources" expander</text>

  <!-- Ollama container -->
  <rect x="20" y="430" width="340" height="110" rx="14" fill="#0f172a"/>
  <text x="190" y="460" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="700">ollama container</text>
  <text x="190" y="480" text-anchor="middle" fill="#cbd5e1" font-size="11">llama3.1:8b + nomic-embed-text</text>
  <text x="190" y="498" text-anchor="middle" fill="#cbd5e1" font-size="11">port 11434</text>
  <text x="190" y="518" text-anchor="middle" fill="#94a3b8" font-size="10">(persisted via ollama_storage volume)</text>

  <!-- Docker network links (dashed, no directional bias) -->
  <path d="M538,135 C 380,300 260,360 150,430" stroke="#b45309" stroke-width="2" fill="none" stroke-dasharray="5,5"/>
  <path d="M767,271 C 620,360 320,400 230,430" stroke="#15803d" stroke-width="2" fill="none" stroke-dasharray="5,5"/>
  <text x="470" y="400" fill="#6b7280" font-size="11" font-style="italic">docker bridge network</text>

  <!-- Legend -->
  <g font-size="12" fill="#374151">
    <rect x="420" y="440" width="14" height="14" fill="#3b82f6"/><text x="440" y="451">Retrieval</text>
    <rect x="530" y="440" width="14" height="14" fill="#f59e0b"/><text x="550" y="451">Embedding</text>
    <rect x="660" y="440" width="14" height="14" fill="#22c55e"/><text x="680" y="451">Generation</text>
    <rect x="790" y="440" width="14" height="14" fill="#6b7280"/><text x="810" y="451">Context</text>
    <rect x="900" y="440" width="14" height="14" fill="#0891b2"/><text x="920" y="451">Storage</text>
    <rect x="420" y="465" width="14" height="14" fill="#111827"/><text x="440" y="476">Start / End</text>
    <rect x="530" y="465" width="14" height="14" fill="#0f172a"/><text x="550" y="476">Docker container</text>
  </g>
</svg>
